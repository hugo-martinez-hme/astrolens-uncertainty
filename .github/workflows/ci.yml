name: AstroLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint (Ruff) & Unit Tests (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package in editable mode with dev tools
        run: |
          pip install -e ".[dev]"

      - name: Run Ruff linter and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest suite
        run: |
          pytest --cov=src/astrolens --cov-report=term-missing